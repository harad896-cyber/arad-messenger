name: Build Android APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Detect web output
        shell: bash
        run: |
          set -euo pipefail
          for candidate in dist .output/public build; do
            if [ -d "$candidate" ]; then
              echo "WEB_DIR=$candidate" >> "$GITHUB_ENV"
              echo "Using web output: $candidate"
              exit 0
            fi
          done
          echo 'No supported web output directory found.'
          find . -maxdepth 3 -type d | sort | head -100
          exit 1

      - name: Install Capacitor tooling
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor
        run: npx cap init "Arad Messenger" "com.arad.messenger" --web-dir "$WEB_DIR" --npm-client npm

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
