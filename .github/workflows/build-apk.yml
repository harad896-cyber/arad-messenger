name: Build Arad Messenger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://bkbdcqequyvubjmrbpqo.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          npm run build

      # TanStack Start builds a server-rendered app and does not emit a root index.html.
      # Capacitor requires one, so use a tiny native entry page that opens the hosted app.
      - name: Create Android web entry point
        env:
          ARAD_MESSENGER_WEB_URL: ${{ secrets.ARAD_MESSENGER_WEB_URL || 'https://arad-messenger-8duh-3awk94jja-harad896-1221.vercel.app' }}
        run: |
          set -euo pipefail
          test -d .output/public
          cat > .output/public/index.html <<'HTML'
          <!doctype html>
          <html lang="fa" dir="rtl">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
              <meta name="theme-color" content="#101426">
              <title>Arad Messenger</title>
            </head>
            <body style="margin:0;background:#101426;color:#fff;font-family:system-ui,sans-serif">
              <p style="padding:24px;text-align:center">در حال باز کردن پیام‌رسان آراد…</p>
              <script>location.replace(__ARAD_URL__);</script>
              <noscript>برای استفاده از پیام‌رسان، JavaScript را فعال کنید.</noscript>
            </body>
          </html>
          HTML
          node -e 'const fs=require("node:fs"); const p=".output/public/index.html"; fs.writeFileSync(p,fs.readFileSync(p,"utf8").replace("__ARAD_URL__",JSON.stringify(process.env.ARAD_MESSENGER_WEB_URL)))'
          test -s .output/public/index.html

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor
        run: npx cap init "Arad Messenger" "com.arad.messenger.test" --web-dir ".output/public"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Verify Android web assets
        run: test -f android/app/src/main/assets/public/index.html

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
