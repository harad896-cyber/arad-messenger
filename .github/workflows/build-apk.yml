name: Build Arad Messenger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "${VITE_SUPABASE_URL}" || { echo "Missing GitHub secret: VITE_SUPABASE_URL (or SUPABASE_URL)"; exit 1; }
          test -n "${VITE_SUPABASE_PUBLISHABLE_KEY}" || { echo "Missing GitHub secret: VITE_SUPABASE_PUBLISHABLE_KEY (or SUPABASE_PUBLISHABLE_KEY)"; exit 1; }
          npm run build

      - name: Prepare Capacitor web entry
        shell: bash
        run: |
          set -euo pipefail
          WEB_DIR=".output/public"
          test -d "$WEB_DIR"
          CSS_FILE="$(find "$WEB_DIR/assets" -maxdepth 1 -type f -name '*.css' | head -1 || true)"
          JS_FILE="$(find "$WEB_DIR/assets" -maxdepth 1 -type f -name 'index-*.js' | head -1 || true)"
          if [ -z "$JS_FILE" ]; then
            JS_FILE="$(find "$WEB_DIR/assets" -maxdepth 1 -type f -name '*.js' | head -1 || true)"
          fi
          test -n "$JS_FILE"
          JS_NAME="${JS_FILE#"$WEB_DIR"/}"
          CSS_NAME=""
          if [ -n "$CSS_FILE" ]; then CSS_NAME="${CSS_FILE#"$WEB_DIR"/}"; fi
          {
            echo '<!doctype html>'
            echo '<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>آراد مسنجر</title>'
            if [ -n "$CSS_NAME" ]; then echo "<link rel=\"stylesheet\" href=\"/$CSS_NAME\">"; fi
            echo '</head><body><div id="root"></div>'
            echo "<script type=\"module\" src=\"/$JS_NAME\"></script>"
            echo '</body></html>'
          } > "$WEB_DIR/index.html"
          echo "Prepared $WEB_DIR/index.html using $JS_NAME"

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor
        run: npx cap init "Arad Messenger" "com.arad.messenger" --web-dir ".output/public"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Verify Android web assets
        run: test -f android/app/src/main/assets/public/index.html

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
