name: Build Arad Messenger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://bkbdcqequyvubjmrbpqo.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          npm run build

      - name: Prepare Capacitor web entry
        shell: bash
        run: |
          set -euo pipefail
          WEB_DIR=".output/public"
          INDEX="$WEB_DIR/index.html"
          test -d "$WEB_DIR"
          test -s "$INDEX"

          # Keep TanStack Start's generated HTML/SSR bootstrap intact.
          # Only rewrite root-relative asset URLs for Capacitor's local WebView.
          python3 - <<'PY'
          from pathlib import Path
          p = Path(".output/public/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace('src="/assets/', 'src="./assets/')
          s = s.replace('href="/assets/', 'href="./assets/')
          p.write_text(s, encoding="utf-8")
          PY

          echo "Prepared $INDEX without replacing TanStack Start bootstrap"

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor
        run: npx cap init "Arad Messenger" "com.arad.messenger.test" --web-dir ".output/public"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Verify Android web assets
        run: test -f android/app/src/main/assets/public/index.html

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arad-messenger-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
